name: Build UWP package for Xbox Series S

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export Godot project as UWP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p build/uwp

      - name: Export UWP package with Godot 3.5.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "UWP Xbox Series S"
          use_godot_3: true
          use_preset_export_path: true

      - name: Confirm package exists
        run: test -s build/uwp/MegaManX8Zashiko.appx

      - name: Upload unsigned UWP package
        uses: actions/upload-artifact@v4
        with:
          name: uwp-unsigned
          path: build/uwp/MegaManX8Zashiko.appx
          if-no-files-found: error

  sign:
    name: Sign package for Developer Mode sideloading
    needs: export
    runs-on: windows-latest
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: uwp-unsigned
          path: package

      - name: Create temporary test certificate and sign package
        shell: pwsh
        run: |
          $subject = "CN=SamAlzate"
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $subject `
            -KeyUsage DigitalSignature `
            -FriendlyName "Mega Man X8 Zashiko UWP Test" `
            -CertStoreLocation "Cert:\\CurrentUser\\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "test-signing.pfx" -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "MegaManX8Zashiko.cer" | Out-Null

          $appx = Get-ChildItem -Path "package" -Filter "*.appx" -Recurse | Select-Object -First 1
          if (-not $appx) { throw "The exported APPX package was not found." }

          $sdk = Get-ChildItem "C:\\Program Files (x86)\\Windows Kits\\10\\bin" -Directory |
            Where-Object Name -Match '^10\\.' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows 10 SDK not found on runner." }
          $signtool = Join-Path $sdk.FullName "x64\\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool.exe not found." }

          & $signtool sign /fd SHA256 /a /f "test-signing.pfx" /p $password $appx.FullName
          if ($LASTEXITCODE -ne 0) { throw "APPX signing failed." }

      - name: Upload signed package and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: xbox-devmode-package
          path: |
            package/*.appx
            MegaManX8Zashiko.cer
          if-no-files-found: error
