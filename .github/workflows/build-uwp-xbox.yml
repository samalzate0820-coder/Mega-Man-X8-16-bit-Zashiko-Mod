name: Build UWP package for Xbox Series S

on:
  workflow_dispatch:
  push:
    branches:
      - uwp-xbox-series-port

permissions:
  contents: read

jobs:
  export:
    name: Export Godot project as UWP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p build/uwp

      - name: Export UWP package with Godot 3.5.3
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          presets_to_export: "UWP Xbox Series S"
          use_godot_3: true
          use_preset_export_path: true

      - name: Normalize exported package path
        shell: bash
        run: |
          set -euo pipefail
          appx_path="$(find build/uwp -type f -name '*.appx' -print -quit)"
          if [ -z "$appx_path" ]; then
            echo "Godot did not produce an APPX package."
            find build/uwp -maxdepth 5 -type f -print
            exit 1
          fi
          if [ "$appx_path" != "build/uwp/MegaManX8Zashiko.appx" ]; then
            cp "$appx_path" build/uwp/MegaManX8Zashiko.appx
          fi
          test -s build/uwp/MegaManX8Zashiko.appx

      - name: Upload unsigned UWP package
        uses: actions/upload-artifact@v4
        with:
          name: uwp-unsigned
          path: build/uwp/MegaManX8Zashiko.appx
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Repackage, validate and sign UWP package
    needs: export
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: uwp-unsigned
          path: incoming

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw "Windows 10 SDK was not found." }
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          if (-not (Test-Path $makeappx)) { throw "MakeAppx.exe was not found: $makeappx" }
          if (-not (Test-Path $signtool)) { throw "SignTool.exe was not found: $signtool" }
          "MAKEAPPX=$makeappx" >> $env:GITHUB_ENV
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV

      - name: Rebuild package as MSIX with MakeAppx
        shell: pwsh
        run: |
          $source = Get-ChildItem -Path "incoming" -Filter "*.appx" -Recurse | Select-Object -First 1
          if (-not $source) { throw "The unsigned Godot APPX input package was not found." }

          # Godot 3.5 can emit an APPX whose block map MakeAppx cannot parse.
          # APPX is a ZIP container: extract its payload without trusting the old block map,
          # then let MakeAppx generate fresh package metadata and a valid block map.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $unpacked = Join-Path $PWD "appx-content"
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($source.FullName, $unpacked)

          $manifest = Join-Path $unpacked "AppxManifest.xml"
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "AppxManifest.xml is missing from the Godot export."
          }

          [xml]$manifestXml = Get-Content -LiteralPath $manifest -Raw
          $manifestPublisher = [string]$manifestXml.Package.Identity.Publisher
          if ($manifestPublisher -ne "CN=SamAlzate") {
            throw "Package publisher '$manifestPublisher' does not match the signing certificate subject 'CN=SamAlzate'."
          }

          # Remove package-generated files; MakeAppx creates fresh versions.
          @("AppxBlockMap.xml", "[Content_Types].xml", "AppxSignature.p7x") | ForEach-Object {
            $metadata = Join-Path $unpacked $_
            if (Test-Path -LiteralPath $metadata) {
              Remove-Item -LiteralPath $metadata -Force
            }
          }

          $package = Join-Path $PWD "MegaManX8Zashiko-unsigned.msix"
          & $env:MAKEAPPX pack /d $unpacked /p $package /o
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx could not rebuild the APPX package from the extracted Godot payload."
          }
          if (-not (Test-Path -LiteralPath $package) -or (Get-Item -LiteralPath $package).Length -le 0) {
            throw "MakeAppx did not produce a non-empty APPX package."
          }

          New-Item -ItemType Directory -Force -Path "signed" | Out-Null
          Copy-Item -LiteralPath $package -Destination "signed/MegaManX8Zashiko.msix"
      - name: Create temporary signing certificate
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "SIGNING_DIAG: starting certificate creation"
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=SamAlzate" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(2) `
            -FriendlyName "Mega Man X8 Zashiko UWP Developer Mode" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3,1.3.6.1.4.1.311.10.3.13", "2.5.29.19={text}")
          if (-not $cert) { throw "New-SelfSignedCertificate returned no certificate." }
          Write-Host "SIGNING_DIAG: certificate created; exporting PFX and CER"
          $password = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "temporary-signing.pfx" -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "signed/MegaManX8Zashiko.cer" | Out-Null
          if (-not (Test-Path "temporary-signing.pfx") -or -not (Test-Path "signed/MegaManX8Zashiko.cer")) {
            throw "The temporary signing certificate files were not exported."
          }
          Write-Output "::add-mask::$password"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_PFX_PASSWORD=$password"
          Write-Host "SIGNING_DIAG: certificate files exported and preparation completed"

      - name: Trust temporary signing certificate
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = "Stop"
          $certificate = "signed/MegaManX8Zashiko.cer"
          if (-not (Test-Path $certificate)) { throw "Public signing certificate was not found." }
          Write-Host "SIGNING_DIAG: adding certificate to CurrentUser Root with certutil"
          & certutil.exe -addstore -f Root $certificate
          $trustExit = $LASTEXITCODE
          Write-Host "SIGNING_DIAG: certutil exit code: $trustExit"
          if ($trustExit -ne 0) { throw "certutil could not add the signing certificate to the trusted root store." }
          Write-Host "SIGNING_DIAG: certificate trust import completed"

      - name: Sign MSIX package
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $package = "signed/MegaManX8Zashiko.msix"
          if (-not (Test-Path $package)) { throw "MSIX package to sign was not found." }
          if (-not (Test-Path "temporary-signing.pfx")) { throw "Temporary PFX signing key was not found." }
          Write-Host "SIGNING_DIAG: invoking SignTool sign"
          & $env:SIGNTOOL sign /fd SHA256 /f "temporary-signing.pfx" /p $env:SIGNING_PFX_PASSWORD /v $package
          $signExit = $LASTEXITCODE
          Write-Host "SIGNING_DIAG: SignTool sign exit code: $signExit"
          if ($signExit -ne 0) { throw "SignTool failed to sign the rebuilt MSIX package (exit code $signExit)." }
          Write-Host "SIGNING_DIAG: APPX signing completed"

      - name: Verify MSIX signature
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "SIGNING_DIAG: invoking SignTool verify"
          & $env:SIGNTOOL verify /pa /v "signed/MegaManX8Zashiko.msix"
          $verifyExit = $LASTEXITCODE
          Write-Host "SIGNING_DIAG: SignTool verify exit code: $verifyExit"
          if ($verifyExit -ne 0) { throw "SignTool signature verification failed (exit code $verifyExit)." }
          Write-Host "SIGNING_DIAG: signature verification completed"

      - name: Upload signed package and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: xbox-devmode-package
          path: |
            signed/MegaManX8Zashiko.msix
            signed/MegaManX8Zashiko.cer
          if-no-files-found: error
          retention-days: 30
